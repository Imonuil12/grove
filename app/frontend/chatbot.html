<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach - Grove</title>
  <link rel="stylesheet" href="style.css?v=grove-1">
  <link rel="stylesheet" href="chat.css?v=grove-1">
</head>
<body class="mc-page">

<div class="mc-app">
  <!-- Sidebar: brand, new chat, searchable history, account -->
  <aside class="mc-side" id="mcSide" aria-label="Conversations">
    <a class="mc-brand" href="index.html" aria-label="Grove home">
      <img class="brand-mark" src="assets/grove-mark.svg" alt="" width="36" height="36">
      <span>Grove</span>
    </a>

    <button type="button" class="mc-new" id="mcNew">
      <span>New chat</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <label class="mc-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="mcSearch" placeholder="Search chats" aria-label="Search conversations">
    </label>

    <div class="mc-side-label"><span>History</span><span id="mcCount">0</span></div>
    <div class="mc-list" id="mcList"></div>

    <div class="mc-side-foot">
      <a class="mc-side-link" href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Home
      </a>
      <a class="mc-side-link" href="index.html#path">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>
        Learning path
      </a>
      <div class="mc-account" id="mcAccount"></div>
    </div>
  </aside>

  <main class="mc-main">
    <header class="mc-topbar">
      <button type="button" class="mc-icon-btn mc-menu-btn" id="mcMenu" aria-label="Open conversations" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="mc-topbar-title">
        <div class="mc-eyebrow">Grove coach <span class="mc-live mc-hide-sm" id="mcLive"><i></i>Personalized</span></div>
        <h1 id="mcTitle">New conversation</h1>
      </div>
      <div class="mc-topbar-actions">
        <button type="button" class="mc-icon-btn" id="mcRename" title="Rename conversation" aria-label="Rename conversation" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button type="button" class="mc-pill" id="mcInsightsBtn" aria-pressed="true" aria-controls="mcInsights">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>
          <span class="mc-hide-sm">Your learning</span>
        </button>
      </div>
    </header>

    <div class="mc-body">
      <section class="mc-center">
        <div class="mc-thread" id="mcThread" aria-live="polite"></div>
        <div class="mc-composer-wrap">
          <div class="mc-composer">
            <textarea id="mcInput" rows="1" placeholder="Ask about your medication, your health, or say “quiz me”…" aria-label="Message"></textarea>
            <div class="mc-composer-row">
              <div class="mc-composer-tools">
                <select class="mc-select" id="mcDrug" aria-label="Medication"></select>
                <select class="mc-select" id="mcPersona" aria-label="Learning style" title="How the assistant explains things">
                  <option value="needs more explanations">Needs more explanations</option>
                  <option value="the skeptic">The skeptic</option>
                  <option value="trying not to get worse">Trying not to get worse</option>
                  <option value="all in until i'm not">All in until I'm not</option>
                </select>
              </div>
              <button type="button" class="mc-send" id="mcSend"></button>
            </div>
          </div>
          <p class="mc-disclaimer">Educational tool. It doesn't replace advice from your doctor or pharmacist. In an emergency, call 911.</p>
        </div>
      </section>

      <aside class="mc-insights" id="mcInsights" aria-label="Your learning"></aside>
    </div>
  </main>
</div>

<script src="script.js"></script>
<script src="chat-core.js"></script>
<script>
(function () {
  const { ChatController, icon, esc, titleCase, actionHref, accessState, accountPromptHTML } = window.MysChat;
  const access = accessState();  // "account" | "guest" | "signed_out"
  const $ = (id) => document.getElementById(id);
  const drugSel = $("mcDrug");
  const personaSel = $("mcPersona");
  let personaTouched = false;

  // ---------- drug + persona
  const initialDrug = new URLSearchParams(location.search).get("drug")
    || (typeof learningStorage === "function" && learningStorage().getItem("selectedDrug"))
    || "amoxicillin";
  drugSel.innerHTML = `<option value="${esc(initialDrug)}">${esc(titleCase(initialDrug))}</option>`;
  personaSel.addEventListener("change", () => {
    personaTouched = true;
    // Saved to the profile right away, so lessons, the widget and the chat quiz use it too.
    saveLearningPreferences({ archetype: personaSel.value });
  });

  const chat = new ChatController(
    access === "account"
      ? { thread: $("mcThread"), input: $("mcInput"), send: $("mcSend"), list: $("mcList"), search: $("mcSearch"), count: $("mcCount") }
      : { thread: $("mcThread"), input: $("mcInput"), send: $("mcSend") },  // saved history is for accounts
    {
      variant: "full",
      getDrug: () => drugSel.value || "amoxicillin",
      getArchetype: () => null, // the server uses the saved learning style
      pageContext: () => "chatbot",
      onContext: renderContext,
      onTitle: (title) => { $("mcTitle").textContent = title || "New conversation"; document.title = `${title ? title + " · " : ""}Coach - Grove`; },
      onConversationChange: (id) => {
        $("mcRename").hidden = !id;
        const url = new URL(location.href);
        if (id) url.searchParams.set("c", id); else url.searchParams.delete("c");
        history.replaceState(null, "", url);
      },
      onOpenFromList: () => toggleSide(false),
      renderWelcome,
    }
  );

  drugSel.addEventListener("change", async () => {
    try { learningStorage().setItem("selectedDrug", drugSel.value); } catch (e) {}
    await chat.loadContext();
    if (!chat.conversationId) chat.showWelcome();
  });

  // ---------- welcome screen
  function renderWelcome(ctx) {
    const drugName = (ctx && ctx.drug_name) || titleCase(chat.drug);
    const styleLabel = personaSel.options[personaSel.selectedIndex].text;
    const level = ctx ? titleCase(ctx.experience_level) : "";
    return `
      <div class="mc-welcome">
        <div class="mc-welcome-mark">${icon("spark", 22)}</div>
        <h2>What would you like to learn about ${esc(drugName)}?</h2>
        <p>Ask in your own words. I know your learning progress${ctx && ctx.has_intake ? " and health profile" : ""}, so answers are tailored to you, and I can quiz you, review weak spots, or point you to your next lesson.</p>
        <div class="mc-welcome-tags">
          <span class="mc-tag"><i></i>${esc(styleLabel)}</span>
          ${level ? `<span class="mc-tag">${esc(level)} level</span>` : ""}
          ${ctx ? `<span class="mc-tag">${ctx.mastered_count}/${ctx.total_objectives} topics mastered</span>` : ""}
        </div>
        ${chat.starterHTML()}
      </div>`;
  }

  // ---------- "Your learning" panel
  const UNIT_STATE = { done: "Complete", in_progress: "In progress", open: "Not started", locked: "Locked" };

  function renderContext(ctx) {
    const panel = $("mcInsights");
    if (!ctx) {
      panel.innerHTML = `<h3>Your learning</h3><p class="mc-empty-note">Progress will show up here once the server is reachable.</p>`;
      return;
    }
    // Drug list + persona from the server (first load only for persona).
    const current = drugSel.value;
    drugSel.innerHTML = ctx.drugs.map((d) => `<option value="${esc(d.key)}">${esc(d.name)}</option>`).join("");
    drugSel.value = ctx.drugs.some((d) => d.key === current) ? current : ctx.drug;
    if (ctx.archetype) personaSel.value = ctx.archetype;
    $("mcLive").innerHTML = ctx.llm_enabled ? "<i></i>Personalized" : "<i style=\"background:#f59e0b\"></i>Offline answers";

    const next = ctx.next_unit;
    const units = ctx.units.map((u) => `
      <div class="mc-unit ${u.status === "locked" ? "is-locked" : ""}">
        <span class="mc-unit-name">${esc(u.category)}${u.status === "locked" ? icon("shield", 12) : ""}</span>
        <span class="mc-unit-state ${u.status === "done" ? "is-done" : ""}">${UNIT_STATE[u.status]} · ${u.mastered}/${u.total}</span>
        <span class="mc-unit-bar"><i style="width:${u.total ? Math.round(100 * u.mastered / u.total) : 0}%"></i></span>
      </div>`).join("");

    const weak = ctx.struggling.length
      ? `<div class="mc-weak">${ctx.struggling.slice(0, 4).map((s) =>
          `<button type="button" data-review="${esc(s.title)}">${icon("refresh", 14)}<span>${esc(s.title)}</span></button>`).join("")}</div>`
      : `<p class="mc-empty-note">Nothing flagged. Missed quiz questions will show up here so you can review them with me.</p>`;

    panel.innerHTML = `
      <h3>Your learning</h3>
      <p class="mc-sub">${esc(ctx.drug_name)} course</p>
      ${access === "guest" ? `<div class="mc-guest-note">Guest progress resets when you close this tab. <a href="#" onclick="goToLogin(); return false;">Log in</a> to keep it.</div>` : ""}
      <div class="mc-ring-row">
        <div class="mc-ring" style="--p:${ctx.percent}"><b>${ctx.percent}%</b></div>
        <div class="mc-ring-text"><strong>${ctx.mastered_count} of ${ctx.total_objectives} topics</strong><span>mastered so far</span></div>
      </div>
      <div class="mc-stats">
        <div class="mc-stat"><b>${ctx.xp}</b><span>XP</span></div>
        <div class="mc-stat"><b>${ctx.streak}</b><span>Day streak</span></div>
        <div class="mc-stat"><b>${ctx.hearts}</b><span>Hearts</span></div>
      </div>
      <div class="mc-section-title">Units</div>
      ${units}
      ${next ? `<a class="mc-next" href="${esc(actionHref({ type: "lesson", category: next }, ctx.drug))}"><span><small>Up next</small>${esc(next)} lesson</span>${icon("arrow", 16)}</a>` : ""}
      <div class="mc-section-title">Needs review</div>
      ${weak}
      <div class="mc-section-title">Health profile</div>
      <div class="mc-profile-card">
        <span class="mc-starter-icon mc-kind-profile">${icon("user", 15)}</span>
        <div>${ctx.has_intake
          ? `Your intake form is on file, so answers account for your allergies, medications and lifestyle. <a href="index.html#intake">Update it</a>`
          : `Add your health profile so I can flag interactions and tailor advice to you. <a href="index.html#intake">Fill it in</a>`}</div>
      </div>`;

    if (!chat.conversationId && chat.els.thread.querySelector(".mc-welcome")) chat.showWelcome();
  }

  $("mcInsights").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-review]");
    if (btn) chat.ask(`Can we review ${btn.getAttribute("data-review").toLowerCase()}? I've had trouble with it.`);
  });

  // Insights panel toggle (remembered per browser)
  // On wide screens the panel sits beside the chat and its state is remembered;
  // on smaller screens it overlays the chat, so it always starts closed.
  const insightsBtn = $("mcInsightsBtn");
  const wide = () => window.innerWidth > 1180;
  function setInsights(open, remember = true) {
    $("mcInsights").hidden = !open;
    insightsBtn.classList.toggle("is-on", open);
    insightsBtn.setAttribute("aria-pressed", String(open));
    if (remember && wide()) { try { localStorage.setItem("mcInsightsOpen", open ? "1" : "0"); } catch (e) {} }
  }
  insightsBtn.addEventListener("click", () => setInsights($("mcInsights").hidden));
  let insightsPref = null;
  try { insightsPref = localStorage.getItem("mcInsightsOpen"); } catch (e) {}
  setInsights(wide() && insightsPref !== "0", false);
  // Picking a topic to review on a small screen should reveal the chat again.
  $("mcInsights").addEventListener("click", (e) => { if (e.target.closest("[data-review], a") && !wide()) setInsights(false, false); });

  // ---------- sidebar, account, shortcuts
  function toggleSide(open) {
    const side = $("mcSide");
    const isOpen = typeof open === "boolean" ? open : !side.classList.contains("is-open");
    side.classList.toggle("is-open", isOpen);
    $("mcMenu").setAttribute("aria-expanded", String(isOpen));
    let scrim = document.querySelector(".mc-scrim");
    if (isOpen && !scrim && window.innerWidth <= 860) {
      scrim = document.createElement("div");
      scrim.className = "mc-scrim";
      scrim.addEventListener("click", () => toggleSide(false));
      document.body.appendChild(scrim);
    } else if (!isOpen && scrim) scrim.remove();
  }
  $("mcMenu").addEventListener("click", () => toggleSide());
  $("mcNew").addEventListener("click", () => { chat.newChat(); toggleSide(false); });
  $("mcRename").addEventListener("click", () => chat.conversationId && chat.rename(chat.conversationId));

  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "o") { e.preventDefault(); chat.newChat(); }
    if (e.key === "Escape" && chat.streaming) chat.stop();
  });

  function renderAccount() {
    const el = $("mcAccount");
    if (isGuest()) {
      el.innerHTML = `<div class="mc-account-avatar">G</div>
        <div class="mc-account-text"><strong>Guest</strong><span>Chats end with this session</span></div>
        <button type="button" class="mc-icon-btn" style="color:#cbd5e1" title="Log in or sign up" aria-label="Log in or sign up" onclick="goToLogin()">${icon("arrow", 15)}</button>`;
      return;
    }
    if (access === "signed_out") {
      el.innerHTML = `<div class="mc-account-avatar">${icon("user", 15)}</div>
        <div class="mc-account-text"><strong>Not signed in</strong><span>Log in or continue as a guest</span></div>
        <button type="button" class="mc-icon-btn" style="color:#cbd5e1" title="Log in" aria-label="Log in" onclick="goToLogin()">${icon("arrow", 15)}</button>`;
      return;
    }
    const name = getUsername() || "";
    el.innerHTML = `<div class="mc-account-avatar">${esc((name[0] || "U").toUpperCase())}</div>
      <div class="mc-account-text"><strong title="${esc(name)}">${esc(name)}</strong><span>Chats are saved to your account</span></div>
      <button type="button" class="mc-icon-btn" style="color:#cbd5e1" title="Sign out" aria-label="Sign out" onclick="logout(); location.href='index.html'">${icon("arrow", 15)}</button>`;
  }

  // Account-only feature (saved history) for guests; everything is gated when signed out.
  function applyAccess() {
    if (access === "account") return;
    $("mcSearch").closest(".mc-search").hidden = true;
    $("mcCount").parentElement.hidden = true;
    $("mcList").innerHTML = accountPromptHTML({
      title: access === "guest" ? "Keep your chat history" : "Your saved chats",
      body: access === "guest"
        ? "Guest chats disappear when you close this tab. Log in or sign up to save and search your conversations."
        : "Log in to save and search your conversations.",
      guest: false, compact: true,
    });
    if (access !== "signed_out") return;
    $("mcLive").hidden = true;
    $("mcThread").innerHTML = accountPromptHTML({
      title: "Sign in to talk to your coach",
      body: "Log in to get a tutor that knows your health profile and progress and saves your chats, or continue as a guest to try it now.",
    });
    $("mcInput").disabled = true;
    $("mcInput").placeholder = "Sign in or continue as a guest to chat";
    document.querySelector(".mc-composer").classList.add("is-locked");
    $("mcNew").hidden = true;
    $("mcInsights").innerHTML = `<h3>Your learning</h3><p class="mc-empty-note">Sign in or continue as a guest to see your progress here.</p>`;
  }

  window.addEventListener("DOMContentLoaded", () => {
    renderAccount();
    applyAccess();
    if (access === "signed_out") return;
    chat.init();
    $("mcInput").focus();
  });
})();
</script>
</body>
</html>
