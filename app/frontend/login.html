<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Grove</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="app.css?v=m1">
  <script>try{const t=localStorage.getItem("grove:theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <!-- Only used when the server is configured for AWS Cognito -->
  <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js" defer></script>
</head>
<body class="auth">
  <main class="auth-card card">
    <a class="brand" href="index.html"><img src="assets/grove-mark.svg" alt=""> Grove</a>
    <h1 style="font-size:26px">Welcome back</h1>
    <p class="muted" id="note">Sign in to continue growing.</p>
    <form id="form" novalidate>
      <div class="field"><label for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label>
        <input class="input" id="password" type="password" autocomplete="current-password" required></div>
      <p class="form-error" id="error" role="alert"></p>
      <button class="btn btn-primary w-full" type="submit" id="submit">Sign in</button>
    </form>
    <div class="divider">or</div>
    <button class="btn btn-ghost w-full" type="button" id="guest">Try without an account</button>
    <p class="small muted" style="margin-top:8px">Guest data is temporary and disappears when you close the tab.</p>
    <p style="margin:18px 0 0">New to Grove? <a href="signup.html" id="signupLink">Create an account</a></p>
  </main>
  <script type="module">
    import { safeNext, startGuest } from "./core.js";
    import { signIn } from "./auth/authService.js";

    const params = new URLSearchParams(location.search);
    const next = safeNext(params.get("next"));
    if (params.get("expired")) document.getElementById("note").textContent = "Your session ended. Please sign in again.";
    document.getElementById("signupLink").href = `signup.html?next=${encodeURIComponent(next)}`;
    const error = document.getElementById("error");

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) { error.textContent = "Enter your email and password."; return; }
      const button = document.getElementById("submit");
      button.disabled = true;
      error.textContent = "";
      try {
        sessionStorage.removeItem("guestToken");
        await signIn(email, password);
        location.href = next;
      } catch (err) {
        error.textContent = err.message || "Sign-in failed. Check your email and password.";
        button.disabled = false;
      }
    });

    document.getElementById("guest").addEventListener("click", async (e) => {
      e.target.disabled = true;
      try { await startGuest(next); } catch (err) { error.textContent = err.message; e.target.disabled = false; }
    });
  </script>
</body>
</html>
